[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-rea"
version = "1.0.0"
description = "Lightweight Multi-Format Binary Reverse Engineering & Triage Tool for AI Agents and Systems Engineers"
readme = "README.md"
authors = [{ name = "spartak", email = "spartak.dev@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["reverse-engineering", "pe32", "macho", "elf", "rtti", "x87", "rosetta2"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Disassemblers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
lean-rea = "lean_rea.cli:main"
